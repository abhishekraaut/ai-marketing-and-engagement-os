services:

  # =========================
  # FastAPI API (Web Service - Free)
  # =========================
  - type: web
    name: marketing-os-api
    plan: free
    runtime: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && alembic upgrade head && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marketing-os-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: marketing-os-redis
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      - key: FRONTEND_URL
        value: https://ai-marketing-and-engagement-os.vercel.app

    healthCheckPath: /api/v1/health


  # =========================
  # Celery Worker + Beat
  # Combined Web Service - Free
  # =========================
  - type: web
    name: marketing-os-worker
    plan: free
    runtime: python

    buildCommand: "cd backend && pip install -r requirements.txt"

    startCommand: "cd backend && (python -m http.server $PORT & celery -A app.workers.celery_app worker --loglevel=info -B)"

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marketing-os-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: marketing-os-redis
          property: connectionString

      - key: AI_PROVIDER
        value: mock


  # =========================
  # Redis / Valkey (Free)
  # =========================
  - type: keyvalue
    name: marketing-os-redis
    plan: free
    ipAllowList: []


# =========================
# PostgreSQL (Free)
# =========================
databases:
  - name: marketing-os-db
    databaseName: marketing_os
    user: abhi
    plan: free