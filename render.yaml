services:

  # =========================
  # FastAPI API
  # =========================
  - type: web
    name: marketing-os-api
    runtime: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marketing-os-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: marketing-os-redis
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      - key: FRONTEND_URL
        value: https://ai-marketing-os.vercel.app

    healthCheckPath: /api/v1/health


  # =========================
  # Celery Worker
  # =========================
  - type: worker
    name: marketing-os-worker
    runtime: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && celery -A app.workers.celery_app worker --loglevel=info"

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marketing-os-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: marketing-os-redis
          property: connectionString

      - key: AI_PROVIDER
        value: mock


  # =========================
  # Celery Beat
  # =========================
  - type: worker
    name: marketing-os-beat
    runtime: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && celery -A app.workers.celery_app beat --loglevel=info"

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marketing-os-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: marketing-os-redis
          property: connectionString


  # =========================
  # Redis / Valkey
  # =========================
  - type: keyvalue
    name: marketing-os-redis
    plan: free
    ipAllowList: []


# =========================
# PostgreSQL
# =========================
databases:

  - name: marketing-os-db
    databaseName: marketing_os
    user: admin
    plan: free