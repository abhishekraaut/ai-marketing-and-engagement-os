services:
  - type: web
    name: marketing-os-api
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marketing-os-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: marketing-os-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: "https://ai-marketing-os.vercel.app" # Will need updating with actual Vercel URL
    healthCheckPath: /api/v1/health

  - type: worker
    name: marketing-os-worker
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && celery -A app.workers.celery_app worker --loglevel=info"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marketing-os-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: marketing-os-redis
          property: connectionString
      - key: AI_PROVIDER
        value: "mock"

  - type: worker
    name: marketing-os-beat
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && celery -A app.workers.celery_app beat --loglevel=info"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: marketing-os-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: marketing-os-redis
          property: connectionString

databases:
  - name: marketing-os-db
    databaseName: marketing_os
    user: admin
    plan: free

  - type: redis
    name: marketing-os-redis
    ipAllowList: [] # internal only
